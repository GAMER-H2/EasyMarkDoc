<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="emd-token" content="__EMD_TOKEN__" />
  <title>EasyMarkDoc</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%23ff9f0a'/><path d='M9 7h10l5 5v13H9z' fill='white'/><path d='M19 7v5h5' fill='%23ffd60a'/></svg>" />
  <link rel="stylesheet" href="/assets/vendor/codemirror/codemirror.css" />
  <link rel="stylesheet" href="/assets/styles.css" />
  <script src="/assets/vendor/codemirror/codemirror.js"></script>
  <script src="/assets/vendor/codemirror/overlay.js"></script>
  <script src="/assets/vendor/codemirror/xml.js"></script>
  <script src="/assets/vendor/codemirror/markdown.js"></script>
  <script src="/assets/vendor/codemirror/gfm.js"></script>
  <script src="/assets/vendor/codemirror/css.js"></script>
  <script src="/assets/vendor/codemirror/continuelist.js"></script>
  <script src="/assets/vendor/codemirror/placeholder.js"></script>
  <script src="/assets/vendor/codemirror/searchcursor.js"></script>
  <script>
    // Show a clear message instead of a dead page if the editor can't start
    // (most often a content blocker blocking one of its script files).
    window.emdBootError = function (detail) {
      if (window.emdBooted || document.getElementById("boot-error")) return;
      var box = document.createElement("div");
      box.id = "boot-error";
      box.setAttribute("role", "alert");
      box.innerHTML =
        "<strong>EasyMarkDoc couldn't start.</strong><p></p>" +
        "<p>If you use a content blocker such as uBlock Origin, allow this page " +
        "(127.0.0.1 / localhost) in it and reload. Otherwise, check the browser " +
        "console for details.</p>";
      box.querySelector("p").textContent = detail || "";
      document.body.prepend(box);
    };
    window.addEventListener("error", function (e) {
      if (!window.emdBooted) window.emdBootError(e.message);
    });
    window.addEventListener("unhandledrejection", function (e) {
      if (!window.emdBooted) window.emdBootError(String(e.reason && e.reason.message || e.reason));
    });
    window.addEventListener("load", function () {
      setTimeout(function () {
        window.emdBootError("The editor's scripts did not finish loading.");
      }, 10000);
    });
  </script>
  <script type="module" src="/assets/js/app.js" onerror="emdBootError('A script file could not be loaded (it may have been blocked).')"></script>
</head>
<body>
  <header class="toolbar">
    <div class="tb-group">
      <button type="button" class="tb-button" data-popover="view-menu" title="View">
        <span class="tb-icon" data-icon="sidebar"></span><span class="tb-label">View</span>
      </button>
      <button type="button" class="tb-button zoom-button" data-popover="zoom-menu" title="Zoom">
        <span class="tb-zoom-value" id="zoom-value">Fit</span><span class="tb-label">Zoom</span>
      </button>
    </div>

    <div class="tb-title">
      <button type="button" class="doc-title" data-popover="title-menu">
        <span id="doc-title">Untitled</span>
        <span class="doc-edited" id="doc-edited" hidden>— Edited</span>
        <span class="tb-chevron" data-icon="chevron"></span>
      </button>
    </div>

    <div class="tb-group tb-center">
      <button type="button" class="tb-button" data-popover="insert-menu" title="Insert">
        <span class="tb-icon" data-icon="insert"></span><span class="tb-label">Insert</span>
      </button>
      <button type="button" class="tb-button" data-popover="table-menu" title="Table">
        <span class="tb-icon" data-icon="table"></span><span class="tb-label">Table</span>
      </button>
      <button type="button" class="tb-button" data-popover="media-menu" title="Media">
        <span class="tb-icon" data-icon="media"></span><span class="tb-label">Media</span>
      </button>
      <button type="button" class="tb-button" id="proof-toggle" title="Show the exact PDF (read-only)">
        <span class="tb-icon" data-icon="proof"></span><span class="tb-label">Proof</span>
      </button>
    </div>

    <div class="tb-group tb-right">
      <button type="button" class="tb-button" data-popover="export-menu" title="Export">
        <span class="tb-icon" data-icon="export"></span><span class="tb-label">Export</span>
      </button>
      <div class="tb-inspector-toggle">
        <button type="button" class="tb-button" id="show-format" title="Show or hide the text and image format bar">
          <span class="tb-icon" data-icon="format"></span><span class="tb-label">Format</span>
        </button>
        <button type="button" class="tb-button" id="show-document" title="Show or hide page setup and theme settings">
          <span class="tb-icon" data-icon="document"></span><span class="tb-label">Document</span>
        </button>
      </div>
    </div>
  </header>

  <aside class="inspector" id="inspector" aria-label="Format bar"></aside>

  <main class="workspace" id="workspace">
    <section class="source-pane" id="source-pane">
      <div class="source-tabs">
        <div class="seg small" role="tablist">
          <button type="button" class="active" data-editor="markdown">Markdown</button>
          <button type="button" data-editor="css">Theme CSS</button>
        </div>
        <span class="source-info" id="file-path"></span>
      </div>
      <div class="editor-host" id="markdown-editor"></div>
      <div class="editor-host" id="css-editor" hidden></div>
    </section>

    <div class="sync-rail" id="sync-rail">
      <div class="rail-resize" id="splitter" role="separator" aria-orientation="vertical" tabindex="0"></div>
      <div class="rail-buttons">
        <button type="button" id="go-page" title="Show the source cursor on the page (⌥⌘→)" data-icon="toPage"></button>
        <button type="button" id="go-source" title="Show the page cursor in the source (⌥⌘←)" data-icon="toSource"></button>
      </div>
    </div>

    <section class="canvas" id="canvas">
      <div class="page-host" id="page-view"></div>
      <div class="proof-host" id="proof-view" hidden></div>
      <div class="proof-banner" id="proof-banner" hidden>
        Proof — exact PDF output (read-only).
        <button type="button" id="proof-exit">Back to Editing</button>
      </div>
      <div class="canvas-status" id="status"></div>
    </section>

  </main>

  <!-- Popovers -->
  <div class="popover" id="view-menu" hidden>
    <button type="button" data-cmd="toggle-source"><span class="check" data-check="source"></span>Markdown Source</button>
    <button type="button" data-cmd="toggle-inspector"><span class="check" data-check="inspector"></span>Format Bar</button>
    <button type="button" data-cmd="toggle-proof"><span class="check" data-check="proof"></span>Proof (exact PDF)</button>
    <hr />
    <button type="button" data-cmd="show-css">Edit Theme CSS</button>
  </div>

  <div class="popover" id="zoom-menu" hidden>
    <button type="button" data-zoom="fit">Fit Width</button>
    <hr />
    <button type="button" data-zoom="50">50%</button>
    <button type="button" data-zoom="75">75%</button>
    <button type="button" data-zoom="100">100%</button>
    <button type="button" data-zoom="125">125%</button>
    <button type="button" data-zoom="150">150%</button>
    <button type="button" data-zoom="200">200%</button>
  </div>

  <div class="popover title-popover" id="title-menu" hidden>
    <label class="pop-field">Name <input type="text" id="doc-name" spellcheck="false" /></label>
    <div class="pop-location" id="doc-location"></div>
    <hr />
    <button type="button" data-cmd="new">New Document</button>
    <button type="button" data-cmd="open-disk">Open…<kbd>⌘O</kbd></button>
    <button type="button" data-cmd="upload">Upload Markdown…</button>
    <hr />
    <button type="button" data-cmd="save-md">Save<kbd>⌘S</kbd></button>
    <button type="button" data-cmd="save-md-as">Save As…</button>
    <button type="button" data-cmd="download-md">Download Markdown</button>
  </div>

  <div class="popover" id="insert-menu" hidden>
    <button type="button" data-insert="pagebreak">Page Break</button>
    <button type="button" data-insert="toc">Table of Contents</button>
    <button type="button" data-insert="footnote">Footnote</button>
    <button type="button" data-insert="hr">Horizontal Line</button>
    <hr />
    <button type="button" data-insert="codeblock">Code Block</button>
    <button type="button" data-insert="quote">Block Quote</button>
    <button type="button" data-insert="tasks">Checklist</button>
    <button type="button" data-insert="link">Link…</button>
  </div>

  <div class="popover table-popover" id="table-menu" hidden>
    <div class="table-picker" id="table-picker"></div>
    <div class="table-picker-label" id="table-picker-label">Insert Table</div>
  </div>

  <div class="popover" id="media-menu" hidden>
    <button type="button" data-cmd="image-file">Choose Image…</button>
    <button type="button" data-cmd="image-url">Image from Web Address…</button>
  </div>

  <div class="popover" id="export-menu" hidden>
    <div class="pop-heading">PDF</div>
    <button type="button" data-cmd="save-pdf">Save to Folder…<kbd>⇧⌘S</kbd></button>
    <button type="button" data-cmd="download-pdf">Download</button>
    <button type="button" data-cmd="print-pdf">Open in New Tab</button>
    <hr />
    <div class="pop-heading">Other Formats</div>
    <button type="button" data-cmd="save-html">HTML to Folder…</button>
    <button type="button" data-cmd="download-md">Markdown</button>
  </div>

  <input type="file" id="upload-md" accept=".md,.markdown,.mdown,.txt,text/markdown" hidden />
  <input type="file" id="upload-css" accept=".css,text/css" hidden />
  <input type="file" id="upload-image" accept="image/*" multiple hidden />

  <dialog id="picker" class="picker">
    <form method="dialog" class="picker-form">
      <h2 id="picker-title">Choose a folder</h2>
      <div class="picker-path">
        <button type="button" id="picker-up" title="Parent folder">‹</button>
        <button type="button" id="picker-home" title="Home folder">⌂</button>
        <input type="text" id="picker-path" spellcheck="false" />
        <button type="button" id="picker-go">Go</button>
      </div>
      <ul class="picker-list" id="picker-list"></ul>
      <label class="picker-name" id="picker-name-row">Save As <input type="text" id="picker-name" spellcheck="false" /></label>
      <p class="picker-error" id="picker-error" hidden></p>
      <div class="picker-actions">
        <button type="button" value="cancel" id="picker-cancel">Cancel</button>
        <button type="submit" class="primary" id="picker-ok">Save</button>
      </div>
    </form>
  </dialog>

  <div class="toast" id="toast" hidden></div>
</body>
</html>
