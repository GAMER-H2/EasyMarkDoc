<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="emd-token" content="__EMD_TOKEN__" />
  <title>EasyMarkDoc Preview</title>
  <link rel="stylesheet" href="/assets/styles.css" />
  <style>
    body { background: #e5e7eb; }
    .preview-toolbar {
      display: flex;
      align-items: center;
      gap: 6px;
      height: 36px;
      padding: 0 8px;
      background: #f9fafb;
      border-bottom: 1px solid var(--border);
      flex: none;
    }
    .preview-toolbar .status { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .preview-toolbar .status.error { color: #b91c1c; }
    .preview-toolbar .export { background: var(--brand); color: #fff; font-weight: 600; }
    .preview-toolbar .export:hover { background: var(--brand-dark); }
    .preview-toolbar .tool { border: 1px solid var(--border); background: #fff; }
    .preview-toolbar .tool:hover { background: var(--hover); }
    #preview { flex: 1; min-height: 0; position: relative; }
    body.vscode-dark .preview-toolbar { background: #252526; border-color: #3c3c3c; color: #ccc; }
    body.vscode-dark .emd-preview-scroller, body.vscode-dark { background: #1e1e1e; }
    body.vscode-dark #zoom, body.vscode-dark .tool, body.vscode-dark .segmented { background: #3c3c3c; border-color: #555; color: #ddd; }
    body.vscode-dark .segmented button { color: #bbb; }
    body.vscode-dark .segmented button.active { color: #fff; }
    body.vscode-dark .tool:hover, body.vscode-dark .icon-button:hover { background: #4a4a4a; }
  </style>
</head>
<body>
  <div class="preview-toolbar">
    <div class="segmented" id="mode-toggle" role="group" aria-label="Preview mode">
      <button type="button" data-mode="pdf" title="Exact PDF rendered by Chromium">PDF</button>
      <button type="button" data-mode="paged" title="Fast paginated HTML preview">Pages (fast)</button>
    </div>
    <select id="zoom" title="Zoom">
      <option value="fit">Fit width</option>
      <option value="50">50%</option>
      <option value="75">75%</option>
      <option value="100">100%</option>
      <option value="125">125%</option>
      <option value="150">150%</option>
    </select>
    <button type="button" class="icon-button" id="refresh" title="Refresh preview">⟳</button>
    <span class="status" id="status">Waiting for document…</span>
    <span class="titlebar-spacer"></span>
    <button type="button" class="tool" id="open-editor" title="Open this document in the EasyMarkDoc web editor (styling ribbon)">Style editor</button>
    <button type="button" class="export" id="export">Export PDF</button>
  </div>
  <div id="preview"></div>
  <script type="module" src="/assets/js/preview-page.js"></script>
</body>
</html>
