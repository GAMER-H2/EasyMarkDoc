<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="emd-token" content="__EMD_TOKEN__" />
  <title>EasyMarkDoc Preview</title>
  <link rel="stylesheet" href="/assets/styles.css" />
  <style>
    body { background: var(--canvas); }
    .preview-toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      height: 38px;
      padding: 0 10px;
      background: linear-gradient(#f9f9f9, #efefef);
      border-bottom: 1px solid var(--hairline-strong);
      flex: none;
    }
    .preview-toolbar .status { color: var(--secondary); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .preview-toolbar .status.error { color: #d70015; }
    .preview-toolbar .spacer { flex: 1; }
    .preview-toolbar select, .preview-toolbar .tool {
      height: 22px;
      padding: 0 10px;
      border: 0;
      border-radius: 5px;
      background: #fff;
      box-shadow: 0 0 0 0.5px var(--control-border), 0 1px 1px rgba(0, 0, 0, 0.06);
      font-size: 12px;
    }
    .preview-toolbar .export { background: var(--accent); color: #fff; box-shadow: none; font-weight: 500; }
    #preview { flex: 1; min-height: 0; position: relative; }
    #preview .emd-pdf-pages { padding-top: 16px; }
    body.vscode-dark { --canvas: #1e1e1e; }
    body.vscode-dark .preview-toolbar { background: #252526; border-color: #3c3c3c; color: #ccc; }
    body.vscode-dark .preview-toolbar select, body.vscode-dark .preview-toolbar .tool:not(.export) { background: #3c3c3c; color: #ddd; box-shadow: 0 0 0 0.5px #555; }
    body.vscode-dark .seg { background: rgba(255, 255, 255, 0.1); }
    body.vscode-dark .seg button { color: #ccc; }
    body.vscode-dark .seg button.active { background: #5a5a5a; color: #fff; }
  </style>
</head>
<body>
  <div class="preview-toolbar">
    <div class="seg" id="mode-toggle" role="group" aria-label="Preview mode">
      <button type="button" data-mode="pdf" title="Exact PDF rendered by Chromium">PDF</button>
      <button type="button" data-mode="paged" title="Fast paginated HTML preview">Pages (fast)</button>
    </div>
    <select id="zoom" title="Zoom">
      <option value="fit">Fit width</option>
      <option value="50">50%</option>
      <option value="75">75%</option>
      <option value="100">100%</option>
      <option value="125">125%</option>
      <option value="150">150%</option>
    </select>
    <button type="button" class="tool" id="refresh" title="Refresh preview">↻</button>
    <span class="status" id="status">Waiting for document…</span>
    <span class="spacer"></span>
    <button type="button" class="tool" id="open-editor" title="Open this document in the EasyMarkDoc web editor to edit and style it on the page">Style editor</button>
    <button type="button" class="tool export" id="export">Export PDF</button>
  </div>
  <div id="preview"></div>
  <script type="module" src="/assets/js/preview-page.js"></script>
</body>
</html>
