[package]
name = "EasyMarkDoc"
version = "0.2.0"
edition = "2024"
description = "Convert Markdown to beautifully styled PDF documents using CSS"

[lib]
name = "easymarkdoc"
crate-type = ["rlib"]

[dependencies]
clap = { version = "4", features = ["derive"] }
syntect = { version = "5.3", default-features = false, features = ["default-syntaxes", "default-themes", "html", "plist-load", "regex-fancy"] }
chromiumoxide = { version = "0.9", default-features = false, features = ["bytes", "fetcher", "rustls", "zip8"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "sync", "time", "signal"] }
futures = "0.3"
axum = "0.8"
rust-embed = "8"
mime_guess = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
rand = "0.9"
open = "5"
dirs = "6"
anyhow = "1"
