[package]
name = "EasyMarkDoc"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
clap = { version = "4", features = ["derive"] }
syntect = { version = "5.3", default-features = false, features = ["default-syntaxes", "html", "plist-load", "regex-fancy"] }
genpdf = "0.2"
